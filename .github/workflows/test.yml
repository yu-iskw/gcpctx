name: Test python

on:
  pull_request:
    paths:
      - .github/workflows/test.yml
      - noxfile.py
      - pyproject.toml
      - src/gcpctx/**/*.py
      - pylintrc
      - mise.toml
      - mise.lock
      - Makefile
      - dev/**
      - uv.lock
      - .python-version
      - requirements.setup.txt
  push:
    branches:
      - main
    paths:
      - .github/workflows/test.yml
      - noxfile.py
      - pyproject.toml
      - src/gcpctx/**/*.py
      - pylintrc
      - mise.toml
      - mise.lock
      - Makefile
      - dev/**
      - uv.lock
      - .python-version
      - requirements.setup.txt
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Test supported Python versions
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      PYTHON_PACKAGE_NAME: gcpctx
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
      - name: Install supported Python versions
        run: uv python install 3.11 3.12 3.13
      - name: Run tests across Python versions in parallel
        run: |
          set -euo pipefail
          nox_spec='nox[uv]==2026.7.11'
          uvx --from "${nox_spec}" nox --list >/dev/null
          printf '%s\0' 3.11 3.12 3.13 \
            | xargs -0 -P "$(nproc)" -I{} \
                uvx --from "${nox_spec}" nox --session "tests-{}"
      - name: Prepare primary validation environment
        run: uv sync --frozen --all-extras --python 3.13
      - name: Vulture (dead code)
        run: uv run vulture
      - name: Test build
        run: uv run bash dev/build.sh
      - name: Trunk Check
        if: github.event_name != 'push'
        uses: trunk-io/trunk-action@75699af9e26881e564e9d832ef7dc3af25ec031b # v1
