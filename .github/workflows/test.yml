name: Test python

on:
  pull_request:
    paths:
      - .github/workflows/test.yml
      - pyproject.toml
      - src/gcpctx/**/*.py
      - pylintrc
      - mise.toml
      - mise.lock
      - Makefile
      - dev/**
      - uv.lock
      - .python-version
      - requirements.setup.txt
  push:
    branches:
      - main
    paths:
      - .github/workflows/test.yml
      - pyproject.toml
      - src/gcpctx/**/*.py
      - pylintrc
      - mise.toml
      - mise.lock
      - Makefile
      - dev/**
      - uv.lock
      - .python-version
      - requirements.setup.txt
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.13"]' || '["3.11","3.12","3.13"]') }}
      fail-fast: false
    defaults:
      run:
        shell: bash
    env:
      PYTHON_PACKAGE_NAME: gcpctx
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: bash dev/setup.sh --deps "development"
      - name: Vulture (dead code)
        run: uv run vulture
      - name: Run tests
        run: uv run bash dev/test_python.sh
      - name: Test build
        run: uv run bash dev/build.sh
      - name: Trunk Check
        if: matrix.python-version == '3.13' && github.event_name != 'push'
        uses: trunk-io/trunk-action@75699af9e26881e564e9d832ef7dc3af25ec031b # v1
